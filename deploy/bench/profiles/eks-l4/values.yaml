# REAL GPUs on AWS: 2x g6.xlarge spot (1x L4 24 GB, 4 vCPU, 16 GiB RAM each),
# Qwen2.5-7B-Instruct fp16 (the model and GPU the cost model was calibrated
# on), vLLM + LMCache from lmcache/vllm-openai:v0.5.6. Results from this
# profile are real-GPU results; keep them apart from the simulated profiles.
controlPlaneScheduling:
  nodeSelector: {anton.dev/role: system, node-role.kubernetes.io/control-plane: null}   # null drops the chart default (Helm merges maps)
  tolerations: []
inference:
  backend: vllm
  replicas: 2                        # one per GPU node (spot quota: 2x g6.xlarge)
  preStopSeconds: 20
  terminationGracePeriodSeconds: 60
  vllm:
    image: lmcache/vllm-openai:v0.5.6
    model: Qwen/Qwen2.5-7B-Instruct
    servedModelName: qwen2.5-7b
    maxModelLen: 32768
    gpuMemoryUtilization: 0.90       # ~4.5 GB of KV after 15.2 GB of weights: ~78k tokens
    toolCallParser: hermes
    requests: {cpu: "2", memory: 9Gi}   # g6.xlarge has 16 GiB; leaves room for sandboxes
    nodeSelector: {anton.dev/gpu: "true"}
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    lmcache:
      chunkSize: 256
      localCpuGB: 2                  # small host RAM; the remote tier carries the rest
      serverMemory: 8Gi
      serverCommand: [lmcache_server, 0.0.0.0, "65432"]
  # The cost model's rates: measured on exactly this GPU and model
  # (bench/calibration_vllm_qwen7b.json).
  sim:
    PREFILL_CURVE: "1000:0.2475,2000:0.4922,4000:1.0277,8000:2.1659,16000:4.8260,32000:11.7153"
    PREFILL_MS_PER_TOKEN: "0.3016"
    BYTES_PER_TOKEN: "57344"
    OFFLOAD_BYTES_PER_SEC: "1283000000"
    RESTORE_BYTES_PER_SEC: "627000000"
    FIRST_TOKEN_MS: "30"
    CAPACITY_TOKENS: "78000"
    CONCURRENCY: "4"
sandbox:
  agent: opencode
  model: qwen2.5-7b
  tolerateTaints: [nvidia.com/gpu]   # agents share GPU nodes: a node loss hits both
  workspace: pvc
  storageClassName: anton-gp3
  snapshotClassName: anton-ebs
postgres:
  mode: cnpg
monitoring:
  enabled: false
