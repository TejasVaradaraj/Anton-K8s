    PREFILL_CURVE: "1000:0.2475,2000:0.4922,4000:1.0277,8000:2.1659,16000:4.8260,32000:11.7153"
    PREFILL_MS_PER_TOKEN: "0.3016"        # 16k row; only shown, the curve is used
