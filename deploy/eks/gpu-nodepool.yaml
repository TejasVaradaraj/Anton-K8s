# Applied by up.sh after Terraform (needs Karpenter's CRDs). __NAME__ and
# __NODE_ROLE__ are filled from Terraform outputs; __MAX_GPUS__ is the cost cap.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: __NODE_ROLE__
  amiSelectorTerms: [{alias: al2023@latest}]   # the NVIDIA variant is picked for GPU types
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: __NAME__}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: __NAME__}}]
  associatePublicIPAddress: true
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs: {volumeSize: 120Gi, volumeType: gp3, deleteOnTermination: true}   # vLLM image + weights
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels: {anton.dev/gpu: "true"}
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu}
      taints: [{key: nvidia.com/gpu, effect: NoSchedule}]
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: [__GPU_TYPE__]}
        - {key: topology.kubernetes.io/zone, operator: In, values: [__ZONE__]}   # EBS workspaces stay attachable
      expireAfter: 24h
  limits:
    nvidia.com/gpu: __MAX_GPUS__
  disruption:
    # Only empty nodes, and only after 30 minutes: the benchmark cordons and
    # drains GPU nodes itself and must get them back.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
    budgets: [{nodes: "1"}]
