# One control-plane node (never disrupted: hosts the operator, router and
# cache tier) and four workers that the chaos benchmark drains and kills.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: anton
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8080}
      - {containerPort: 30081, hostPort: 8081}
  - role: worker
  - role: worker
  - role: worker
  - role: worker
