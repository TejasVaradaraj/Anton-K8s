# Product layer: Postgres, and one pod running the API + sync worker + web UI.
# Postgres uses an emptyDir on purpose: session rows can be rebuilt from the
# cluster by the sync worker's relist. Users, chat history and the event log
# would need a real volume in a production install.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anton-postgres
  namespace: anton
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: anton-postgres}}
  template:
    metadata: {labels: {app: anton-postgres}}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: anton}
            - {name: POSTGRES_DB, value: anton}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: anton-db, key: password}}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, anton]}, periodSeconds: 2}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: anton-postgres
  namespace: anton
spec:
  selector: {app: anton-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anton-api
  namespace: anton
spec:
  replicas: 1
  selector: {matchLabels: {app: anton-api}}
  template:
    metadata: {labels: {app: anton-api}}
    spec:
      serviceAccountName: anton
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
        - name: api
          image: anton-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: anton-db, key: password}}}
            - {name: DATABASE_URL, value: "postgresql+psycopg://anton:$(DB_PASSWORD)@anton-postgres:5432/anton"}
            - {name: ROUTER_URL, value: "http://anton-router:8080"}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata:
  name: anton-api
  namespace: anton
spec:
  type: NodePort
  selector: {app: anton-api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30081}]
