{{- if .Values.networkPolicy.enabled }}
# Agent sandboxes run model-generated code, so they are default-deny:
# ingress only from the operator (snapshot calls), the API (workspace view)
# and the benchmark (it checks workspaces survive); egress only to the cache tier (workspace snapshots), the session
# router (the agent's model calls) and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anton-sandbox
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {matchLabels: {app: anton-sandbox}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: anton-operator}}
        - podSelector: {matchLabels: {app: anton-api}}
        - podSelector: {matchLabels: {app: anton-bench}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app: anton-tier}}}]
      ports: [{port: 9000, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app: anton-router}}}]
      ports: [{port: 8080, protocol: TCP}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
# Postgres (statefulset mode) and Redis accept connections only from the
# product layer. CloudNativePG pods are left to CNPG, whose operator in
# another namespace must reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anton-data
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [anton-postgres, anton-redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: anton-api}}
        - podSelector: {matchLabels: {app: anton-sync}}
{{- end }}
