{{- if .Values.monitoring.enabled }}
{{- range $m := list (dict "name" "operator" "port" "metrics") (dict "name" "router" "port" "http") (dict "name" "replica" "port" "http") (dict "name" "api" "port" "http") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anton-{{ $m.name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "anton.labels" $ | nindent 4 }}
spec:
  selector: {matchLabels: {app: anton-{{ $m.name }}}}
  endpoints: [{port: {{ $m.port }}, path: /metrics, interval: 10s}]
{{- end }}
{{- if and .Values.api.enabled (eq .Values.postgres.mode "cnpg") }}
---
# CloudNativePG exposes Postgres metrics on each instance's "metrics" port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: anton-db-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector: {matchLabels: {cnpg.io/cluster: anton-db}}
  podMetricsEndpoints: [{port: metrics}]
{{- end }}
{{- if .Values.monitoring.grafanaDashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anton-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels: {grafana_dashboard: "1"}
data:
  anton.json: |-
{{ .Files.Get "dashboards/anton.json" | indent 4 }}
{{- end }}
{{- end }}
