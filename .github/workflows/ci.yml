name: ci

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./api)" || { gofmt -l ./cmd ./internal ./api; exit 1; }
      - run: go vet ./...
      - name: envtest binaries
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25 use 1.37.0 -p path)" >> "$GITHUB_ENV"
      - name: unit + envtest
        run: go test ./... -count=1

  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: api/requirements*.txt}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/anton
      - name: render every values combination
        run: |
          for args in "" "--set postgres.mode=statefulset" "--set monitoring.enabled=true" \
                      "--set sandbox.workspace=pvc --set networkPolicy.enabled=false" "--set api.enabled=false"; do
            echo "== helm template $args"
            helm template anton deploy/helm/anton -n anton $args > /dev/null
          done
      - name: refuse other namespaces
        run: "! helm template anton deploy/helm/anton -n default > /dev/null 2>&1"

  images:
    runs-on: ubuntu-latest
    needs: [go, api, web, helm]
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/anton:${{ github.sha }}
          cache-from: type=gha,scope=anton
          cache-to: type=gha,mode=max,scope=anton
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/anton-web:${{ github.sha }}
          cache-from: type=gha,scope=anton-web
          cache-to: type=gha,mode=max,scope=anton-web
